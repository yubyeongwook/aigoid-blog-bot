name: 멋쟁이 인사이트 장마감 분석 (강력 다중 트리거)

on:
  schedule:
    - cron: '20 7 * * 1-5' # KST 16:20 (1차)
    - cron: '30 7 * * 1-5' # KST 16:30 (2차)
    - cron: '40 7 * * 1-5' # KST 16:40 (3차)
    - cron: '0 8 * * 1-5'  # KST 17:00 (4차 백업)
  workflow_dispatch:

jobs:
  market_close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: 라이브러리 캐시
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
    - name: 설치
      run: pip install -r requirements.txt
    - name: 장마감 분석 실행
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        BLOG_ID: ${{ secrets.BLOG_ID }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
        NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
      run: python main_daily_close.py
    - name: 자동 커밋
      run: |
        git config user.name "멋쟁이봇"
        git config user.email "aigoid1203@gmail.com"
        git add trackers/ social_content/ || true
        git commit -m "자동: $(date +'%Y-%m-%d') 마감분석+내일예비픽" || true
        git push || true
